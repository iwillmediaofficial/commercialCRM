# Free Supabase projects pause after 7 days without activity. One small public
# request a day keeps the project awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *" # every day, 08:47 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the public site-info function
        env:
          # Public by design (the browser sees it); RLS protects the data.
          SUPABASE_URL: https://zpotoxpaeqeissxycgrz.supabase.co
          SUPABASE_KEY: sb_publishable_zrY3GnheEK6bWrn7bHRDzg_eAgqSSyg
        run: |
          curl -fsS --retry 3 --retry-delay 20 -X POST "$SUPABASE_URL/rest/v1/rpc/public_site_info" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}' -o /dev/null
          echo "Supabase answered."
